<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Sindh - Secure & Fast</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h2 { margin-bottom: 15px; color: #38bdf8; }
        select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        select { background: #334155; color: #fff; }
        button {
            background: #0ea5e9;
            color: #white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #0284c7; }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>VPN Sindh</h2>
        <p class="status" id="statusText">Status: Disconnected</p>

        <label for="serverSelect" style="display:block; text-align:left; font-size:12px; margin-top:10px;">Select Server:</label>
        <select id="serverSelect">
            <option value="sg">⚡ Singapore Free Node (Fast)</option>
            <option value="de">🚀 Germany High Speed Node</option>
            <option value="us">🌐 US Secure Node</option>
        </select>

        <button id="connectBtn" onclick="toggleConnect()">CONNECT</button>
    </div>

    <script>
        let isConnected = false;
        function toggleConnect() {
            const btn = document.getElementById('connectBtn');
            const status = document.getElementById('statusText');
            
            if (!isConnected) {
                btn.style.background = '#ef4444';
                btn.innerText = 'DISCONNECT';
                status.innerText = 'Status: Connected (Secure)';
                status.style.color = '#4ade80';
                isConnected = true;
            } else {
                btn.style.background = '#0ea5e9';
                btn.innerText = 'CONNECT';
                status.innerText = 'Status: Disconnected';
                status.style.color = '#94a3b8';
                isConnected = false;
            }
        }
    </script>
</body>
</html>
