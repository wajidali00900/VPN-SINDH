<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Sindh - Free & Fast</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Authentic Sindhi Ajrak Theme (Deep Maroon, Red & Blue with Ajrak Pattern Style) */
            background: 
                radial-gradient(circle at 50% 50%, rgba(185, 28, 28, 0.3) 0%, rgba(15, 23, 42, 0.95) 80%),
                linear-gradient(135deg, #1e1b4b, #831843, #0f172a);
            color: #fff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 95vh;
        }
        /* Top Header Bar: Menu on Left, Title on Right */
        .top-header {
            width: 100%;
            max-width: 380px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 15px;
            gap: 15px;
        }
        .menu-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: #fca5a5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .container {
            background: rgba(30, 27, 75, 0.7);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(248, 113, 113, 0.2);
        }
        h2 { margin: 0 0 5px 0; color: #fca5a5; font-size: 20px; }
        .timer {
            font-size: 22px;
            font-weight: bold;
            margin: 5px 0;
            color: #f8fafc;
            letter-spacing: 2px;
        }
        .status {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 15px;
        }
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            font-size: 15px;
            background: #311042; 
            color: #fff; 
            outline: none;
        }

        /* Colorful & Vibrant Round Connect Button */
        .connect-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }
        button#connectBtn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            /* Ajrak Style Red/Blue/Indigo Gradient */
            background: linear-gradient(135deg, #ef4444, #3b82f6, #831843);
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            border: 4px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        button#connectBtn:active { 
            transform: scale(0.95); 
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
            color: #cbd5e1;
        }
        .settings-box {
            margin-top: 15px;
            text-align: left;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            color: #cbd5e1;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .settings-box label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
        }
        /* Sidebar Styles */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 10;
            top: 0;
            left: 0;
            background-color: #1e1b4b;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            border-right: 1px solid rgba(248, 113, 113, 0.2);
        }
        .sidebar a {
            padding: 12px 20px;
            text-decoration: none;
            font-size: 16px;
            color: #cbd5e1;
            display: block;
            transition: 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .sidebar a:hover { background-color: #311042; color: #fca5a5; }
        .sidebar .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 24px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Top Header: Menu on Left, Title next to it -->
    <div class="top-header">
        <button class="menu-btn" onclick="openNav()">☰ Menu</button>
        <span class="header-title">VPN Sindh (Ajrak Edition)</span>
    </div>

    <!-- Side Navigation Menu -->
    <div id="mySidebar" class="sidebar">
        <button class="close-btn" onclick="closeNav()">&times;</button>
        <h3 style="color: #fca5a5; padding: 0 20px; margin-bottom: 20px;">Super Options</h3>
        <a href="#" onclick="alert('Smart Proxy is active')">⚡ Smart Proxy</a>
        <a href="#" onclick="shareApp()">🔗 Share App</a>
        <a href="#" onclick="alert('Thank you for rating us!')">⭐ Rate Us</a>
        <a href="#" onclick="alert('VPN Sindh provides fast and secure connection.')">❓ FAQ</a>
        <a href="#" onclick="alert('VPN Sindh v1.0 - All rights reserved')">ℹ️ About</a>
    </div>

    <div class="container">
        <h2>Secure Tunnel</h2>
        <div class="timer" id="timerDisplay">00:00:00</div>
        <p class="status" id="statusText">Status: Not Connected</p>

        <!-- Server List -->
        <label style="display: block; text-align: left; font-size: 12px; color: #cbd5e1; margin-bottom: 5px;">Choose Server Location</label>
        <select id="serverSelect">
            <option value="auto">Loading servers...</option>
        </select>

        <!-- Colorful Round Connect Button -->
        <div class="connect-container">
            <button id="connectBtn" onclick="toggleConnect()">
                <span id="btnText">CONNECT</span>
                <span style="font-size: 11px; font-weight: normal; opacity: 0.9; margin-top: 2px;">TAP TO START</span>
            </button>
        </div>

        <!-- Settings Options -->
        <div class="settings-box">
            <label><input type="checkbox" id="tcpMode"> Enable TCP Mode</label>
            <label><input type="checkbox" id="proxyGoogle"> Proxy Google Play Service</label>
        </div>

        <div class="stats">
            <div>Download: <span id="downSpeed">0.0 KB/s</span></div>
            <div>Upload: <span id="upSpeed">0.0 KB/s</span></div>
        </div>
    </div>

    <script>
        let isConnected = false;
        let timerInterval;
        let seconds = 0;

        function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({
                    title: 'VPN Sindh',
                    text: 'Download fast VPN Sindh app!',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                alert('App Link: ' + window.location.href);
            }
        }

        async function loadServers() {
            const select = document.getElementById('serverSelect');
            try {
                const response = await fetch('servers.json');
                const data = await response.json();
                select.innerHTML = '';
                const serverlist = data.servers || data;
                serverlist.forEach((srv, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.text = srv.name || srv.country || `Free Server ${index + 1}`;
                    select.appendChild(option);
                });
            } catch (error) {
                select.innerHTML = `
                    <option value="sg">🇸🇬 Singapore Free Node (Fast)</option>
                    <option value="de">🇩🇪 Germany High Speed Node</option>
                    <option value="us">🇺🇸 US Secure Node</option>
                `;
            }
        }

        function updateTimer() {
            seconds++;
            const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${hrs}:${mins}:${secs}`;

            document.getElementById('downSpeed').innerText = (Math.random() * (450 - 120) + 120).toFixed(1) + ' KB/s';
            document.getElementById('upSpeed').innerText = (Math.random() * (150 - 40) + 40).toFixed(1) + ' KB/s';
        }

        // Ad Trigger Function
        function triggerDirectAd() {
            window.open('https://uplcm.com/4/10428676', '_blank');
        }

        function toggleConnect() {
            const btn = document.getElementById('connectBtn');
            const btnText = document.getElementById('btnText');
            const status = document.getElementById('statusText');
            const select = document.getElementById('serverSelect');
            const selectedServerName = select.options[select.selectedIndex].text;

            if (!isConnected) {
                btnText.innerText = 'WAIT';
                btn.style.background = 'linear-gradient(135deg, #78350f, #451a03)';
                status.innerText = `Connecting to ${selectedServerName}...`;

                triggerDirectAd();

                setTimeout(() => {
                    btn.style.background = 'linear-gradient(135deg, #ef4444, #991b1b)';
                    btn.style.boxShadow = '0 0 30px rgba(239, 68, 68, 0.6)';
                    btnText.innerText = 'STOP';
                    status.innerText = `Connected: ${selectedServerName}`;
                    status.style.color = '#4ade80';
                    isConnected = true;
                    select.disabled = true;
                    timerInterval = setInterval(updateTimer, 1000);
                }, 1500);
            } else {
                clearInterval(timerInterval);
                seconds = 0;
                document.getElementById('timerDisplay').innerText = '00:00:00';
                document.getElementById('downSpeed').innerText = '0.0 KB/s';
                document.getElementById('upSpeed').innerText = '0.0 KB/s';

                btn.style.background = 'linear-gradient(135deg, #ef4444, #3b82f6, #831843)';
                btn.style.boxShadow = '0 0 30px rgba(239, 68, 68, 0.5)';
                btnText.innerText = 'CONNECT';
                status.innerText = 'Status: Not Connected';
                status.style.color = '#cbd5e1';
                select.disabled = false;
                isConnected = false;
            }
        }

        window.onload = loadServers;
    </script>
</body>
</html>
